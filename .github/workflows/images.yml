name: Images

# Builds the container images (images/). On changes on main → :latest and :sha-…; for a
# release, release.yml always calls this workflow with inputs.tag (even without changes under
# images/) → :X.Y.Z or :X.Y.Z-rc.N matching the binary (sandbox.DefaultImage).
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z); empty for changes on main
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  agent-base:
    name: ade-agent-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davidw475/ade-agent-base
          # Pre-releases (v1.0.0-rc.1) only get :1.0.0-rc.1, no :1.0.
          # For a release the version comes from inputs.tag, not from github.ref (the call by
          # auto-release.yml runs on main); there is no :latest then.
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/agent-base
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/davidw475/ade-agent-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  ade-dev:
    name: ade-dev
    needs: agent-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davidw475/ade-dev
          # For a release the version comes from inputs.tag, not from github.ref (the call by
          # auto-release.yml runs on main); there is no :latest then.
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
      - name: Choose base image
        id: base
        # For a release the base image of the same version just built, otherwise :latest.
        run: |
          if [ -n "$TAG" ]; then
            echo "image=ghcr.io/davidw475/ade-agent-base:${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/davidw475/ade-agent-base:latest" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ inputs.tag }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/ade-dev
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=ade-dev
          cache-to: type=gha,mode=max,scope=ade-dev
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/davidw475/ade-dev
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
