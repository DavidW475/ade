name: Images

# Baut die Container-Images (images/). Bei Änderungen auf main → :latest und :sha-…; bei
# einem Release ruft release.yml diesen Workflow immer mit inputs.tag auf (auch ohne Änderung
# unter images/) → :X.Y.Z bzw. :X.Y.Z-rc.N passend zum Binary (sandbox.DefaultImage).
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_call:
    inputs:
      tag:
        description: Release-Tag (vX.Y.Z); leer bei Änderungen auf main
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  agent-base:
    name: ade-agent-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davidw475/ade-agent-base
          # Vorabversionen (v1.0.0-rc.1) bekommen nur :1.0.0-rc.1, kein :1.0.
          # Beim Release kommt die Version aus inputs.tag, nicht aus github.ref (der Aufruf durch
          # auto-release.yml läuft auf main); :latest gibt es dann nicht.
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/agent-base
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/davidw475/ade-agent-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  ade-dev:
    name: ade-dev
    needs: agent-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davidw475/ade-dev
          # Beim Release kommt die Version aus inputs.tag, nicht aus github.ref (der Aufruf durch
          # auto-release.yml läuft auf main); :latest gibt es dann nicht.
          tags: |
            type=raw,value=latest,enable=${{ inputs.tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
      - name: Basis-Image wählen
        id: base
        # Beim Release das eben gebaute Basis-Image derselben Version, sonst :latest.
        run: |
          if [ -n "$TAG" ]; then
            echo "image=ghcr.io/davidw475/ade-agent-base:${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/davidw475/ade-agent-base:latest" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ inputs.tag }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/ade-dev
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=ade-dev
          cache-to: type=gha,mode=max,scope=ade-dev
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/davidw475/ade-dev
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
