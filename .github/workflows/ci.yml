name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
          retention-days: 1

  go:
    name: Go (Lint, Test, Build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go test -race ./...
        env:
          # Sandbox-Tests gegen den Docker-Daemon des Runners
          ADE_TEST_DOCKER: "1"
      - run: make go
      - name: Binary enthält das Dashboard
        run: |
          ./bin/ade version
          grep -q 'id="root"' internal/api/dist/index.html
      - uses: actions/upload-artifact@v5
        with:
          name: ade-linux-amd64
          path: bin/ade

  shell:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh

  release-config:
    name: GoReleaser-Konfiguration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # #94: Sandbox unter rootless Laufzeiten. Die Tests laufen im systemd-User-Manager des
  # Runner-Nutzers (linger), damit die cgroup-Controller wie auf einem Desktop delegiert sind.
  sandbox-runtimes:
    name: Sandbox (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    needs: web
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker-rootless]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
      - name: systemd-User-Manager starten
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Podman
        if: matrix.runtime == 'podman'
        run: |
          podman version
          podman info --format json | jq -c '{rootless: .host.security.rootless, cgroups: .host.cgroupControllers, net: .host.networkBackend}'
          echo "ADE_TEST_DOCKER_BIN=podman" >> "$GITHUB_ENV"
      - name: rootless Docker
        if: matrix.runtime == 'docker-rootless'
        run: |
          # Ubuntu 24.04 beschränkt unprivilegierte User-Namespaces per AppArmor (rootlesskit).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo systemctl disable --now docker.service docker.socket
          sudo rm -f /var/run/docker.sock
          # Statische Binaries samt rootless-Extras nach ~/bin, Dienst im User-Manager.
          curl -fsSL https://get.docker.com/rootless | FORCE_ROOTLESS_INSTALL=1 sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Laufzeit
        if: matrix.runtime == 'docker-rootless'
        run: docker info --format '{{json .SecurityOptions}} mem={{.MemoryLimit}} cpu={{.CpuCfsQuota}} pids={{.PidsLimit}}'
      - name: Sandbox-Tests
        run: go test -race -count=1 ./internal/sandbox/... ./internal/agent/...
        env:
          ADE_TEST_DOCKER: "1"
