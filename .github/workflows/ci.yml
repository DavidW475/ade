name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
          retention-days: 1

  go:
    name: Go (Lint, Test, Build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go test -race ./...
      - run: make go
      - name: Binary enthält das Dashboard
        run: |
          ./bin/ade version
          grep -q 'id="root"' internal/api/dist/index.html
      - uses: actions/upload-artifact@v5
        with:
          name: ade-linux-amd64
          path: bin/ade
