name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
          retention-days: 1

  go:
    name: Go (Lint, Test, Build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go test -race ./...
        env:
          # sandbox tests against the runner's Docker daemon
          ADE_TEST_DOCKER: "1"
      - run: make go
      - name: Binary contains the dashboard
        run: |
          ./bin/ade version
          grep -q 'id="root"' internal/api/dist/index.html
      - uses: actions/upload-artifact@v5
        with:
          name: ade-linux-amd64
          path: bin/ade

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh scripts/*.sh
      # A new version at the top of the CHANGELOG is released automatically after the merge
      # (auto-release.yml); check format and order here already.
      - name: CHANGELOG version
        run: |
          v=$(scripts/changelog-version.sh CHANGELOG.md)
          echo "Newest version in the CHANGELOG: ${v:-none}"

  release-config:
    name: GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # #94: sandbox under rootless runtimes. The tests run in the systemd user manager of the
  # runner user (linger), so the cgroup controllers are delegated as on a desktop.
  sandbox-runtimes:
    name: Sandbox (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    needs: web
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker-rootless]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: internal/api/dist
      - name: Start systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Podman
        if: matrix.runtime == 'podman'
        run: |
          podman version
          podman info --format json | jq -c '{rootless: .host.security.rootless, cgroups: .host.cgroupControllers, net: .host.networkBackend}'
          echo "ADE_TEST_DOCKER_BIN=podman" >> "$GITHUB_ENV"
      - name: rootless Docker
        if: matrix.runtime == 'docker-rootless'
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor (rootlesskit).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # enable_icc=false for ade-egress (doc/sandbox.md#6-container-runtimes).
          sudo modprobe br_netfilter
          sudo systemctl disable --now docker.service docker.socket
          sudo rm -f /var/run/docker.sock
          # Static binaries including rootless extras to ~/bin, service in the user manager.
          curl -fsSL https://get.docker.com/rootless | FORCE_ROOTLESS_INSTALL=1 sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Runtime
        if: matrix.runtime == 'docker-rootless'
        run: docker info --format '{{json .SecurityOptions}} mem={{.MemoryLimit}} cpu={{.CPUCfsQuota}} pids={{.PidsLimit}}'
      - name: Sandbox tests
        run: |
          go test -race -count=1 -v ./internal/sandbox/...
          go test -race -count=1 ./internal/agent/...
        env:
          ADE_TEST_DOCKER: "1"
