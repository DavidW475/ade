name: Audit

# #95: known vulnerabilities in Go (standard library of the toolchain from go.mod and modules,
# reachable code only) and in the dashboard's npm packages. Also weekly, so that new
# vulnerabilities show up without a PR; then usually raise `toolchain` in go.mod.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: npm audit
        run: npm audit --audit-level=low
        working-directory: web
