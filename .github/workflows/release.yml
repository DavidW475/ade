name: Release

# Zwei Wege: ein von Hand gepushter Tag oder auto-release.yml, das den Tag aus CHANGELOG.md
# setzt und diesen Workflow direkt aufruft (Tags, die mit GITHUB_TOKEN gepusht werden, starten
# keine Workflows).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release-Tag (vX.Y.Z), muss schon existieren
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # GoReleaser erzeugt damit die SBOMs der Archive (sboms in .goreleaser.yaml).
      - uses: anchore/sbom-action/download-syft@v0
      - run: go test -race ./...
        # Ohne Frontend-Build fehlt nur das eingebettete Dashboard; die Tests brauchen es nicht.
      - name: Release-Notizen aus CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt für $version"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      # Provenance für alles in checksums.txt (Archive und ihre SBOMs);
      # prüfen mit `gh attestation verify ade_linux_amd64.tar.gz --repo DavidW475/ade`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

  # Images immer zum Tag bauen (:X.Y.Z), parallel zum Binary. Schlägt der Build fehl,
  # ist der Release-Lauf rot, das Release selbst ist dann aber schon veröffentlicht.
  images:
    name: Images
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
