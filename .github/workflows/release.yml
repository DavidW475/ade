name: Release

# Two ways: a manually pushed tag, or auto-release.yml, which sets the tag from CHANGELOG.md and
# calls this workflow directly (tags pushed with GITHUB_TOKEN start no workflows).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release-Tag (vX.Y.Z), muss schon existieren
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # GoReleaser uses it to create the archives' SBOMs (sboms in .goreleaser.yaml).
      - uses: anchore/sbom-action/download-syft@v0
      - run: go test -race ./...
        # Without a frontend build only the embedded dashboard is missing; the tests do not need it.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      # Provenance for everything in checksums.txt (archives and their SBOMs);
      # verify with `gh attestation verify ade_linux_amd64.tar.gz --repo DavidW475/ade`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

  # Always build images for the tag (:X.Y.Z), in parallel to the binary. If the build fails, the
  # release run is red, but the release itself is already published.
  images:
    name: Images
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
