name: Auto-Release

# Automatic releases from CHANGELOG.md: if, after a merge to main, the top of the CHANGELOG has a
# version `## [X.Y.Z] – YYYY-MM-DD` without a tag yet, this workflow sets the tag vX.Y.Z on the
# commit and calls release.yml (binaries, images, attestation).
# A tag pushed with GITHUB_TOKEN does not start release.yml by itself; hence the direct call.
# scripts/changelog-version.sh reads the version.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  # By hand: as above; if the tag exists but the release does not (run failed), the release is
  # caught up.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Detect version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version from CHANGELOG.md
        id: version
        # Assign first: an error in $(…) as an argument of echo would not fail the step.
        run: |
          version=$(scripts/changelog-version.sh CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "No version in the CHANGELOG, nothing to do."
            exit 0
          fi
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && ! gh release view "$tag" >/dev/null 2>&1; then
              echo "Tag $tag without a release, catching up on the release."
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $tag already exists ($(git rev-list -n 1 "$tag")), nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "ADE $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Release $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag set on $GITHUB_SHA, release is running." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
