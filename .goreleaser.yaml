# GoReleaser configuration for GitHub releases (workflow: .github/workflows/release.yml).
# Check locally: goreleaser check · trial run without publishing: goreleaser release --snapshot --clean
version: 2

project_name: ade

before:
  hooks:
    # Das Dashboard wird ins Binary eingebettet (internal/api/dist).
    - sh -c "cd web && npm ci && npm run build && touch ../internal/api/dist/.gitkeep"

builds:
  - id: ade
    main: ./cmd/ade
    binary: ade
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      # Mit "v" wie `git describe` im Makefile; sandbox.DefaultImage leitet daraus den Image-Tag ab.
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ade
    formats: [tar.gz]
    # Ohne Version im Namen, damit …/releases/latest/download/ade_linux_amd64.tar.gz stabil bleibt.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# SPDX-SBOM je Archiv (braucht syft, im Workflow per anchore/sbom-action/download-syft).
sboms:
  - artifacts: archive

# Die Release-Notizen kommen aus CHANGELOG.md (siehe Workflow).
changelog:
  disable: true

release:
  github:
    owner: DavidW475
    name: ade
  prerelease: auto
  # Install script of the version in the release, e.g. for `ADE_VERSION=… sh install.sh`.
  extra_files:
    - glob: ./install.sh
