# Project configuration: <repo>/.ade/project.yaml
# All keys are optional. Unknown keys are an error. Reference: doc/configuration.md.

# Display name in the dashboard (default: the repository's directory name).
name: My project

# Branch that new workspaces start from
# (default: origin/HEAD or the branch that was checked out at registration).
base_branch: main

# Default adapter for agent sessions: claude, codex or pty.
adapter: claude

# Commands that run in a workspace after it was created (sh -c, one after another, abort on
# the first error). Available: $ADE_WORKSPACE_ID, $ADE_WORKSPACE_PATH.
setup:
  - npm ci
  - go mod download

# Approvals (doc/architecture.md#43-approvals): which tools the agent uses without asking.
# Entries: Tool or Tool(pattern); order deny → ask → allow, everything else waits for an
# approval in the dashboard. A section replaces the default of its environment.
approvals:
  # In the sandbox (default: allow: ["*"]).
  sandbox:
    allow: ["*"]
    deny: ["Bash(git push *)"]
  # Without a sandbox (default: reading and editing files in the workspace).
  local:
    allow: ["Read(**)", "Glob(**)", "Grep(**)", "Edit(**)", "Write(**)", "TodoWrite", "Bash(go test *)", "Bash(npm test)"]
    ask: ["Edit(.github/**)"]
    deny: ["Read(**/.env)"]

# Budgets in USD; 0 or leaving it out means no limit. When a limit is reached, ADE ends the agent
# (status "paused") and creates an approval: "Raise budget" allows another step (session: the
# session budget, month: 10 % of the monthly budget, at least $1) and resumes the agent, "Deny"
# ends it.
budget:
  # Per session; can be overridden at start in the dashboard.
  session_usd: 5
  # All sessions of the project in the calendar month (UTC), also in discarded workspaces.
  monthly_usd: 100

# Triggers start factory runs automatically (doc/factory.md#5-triggers). Triggered runs use the
# sandbox by default and need budget.max_cost_usd in the factory.
triggers:
  # One run per open issue with the label; title and text become the task, the PR closes the
  # issue. The issue text is untrusted input – restrict authors if the repository is public.
  - name: features
    factory: feature
    github_issues:
      label: "ade:feature"
      authors: [octocat]
      interval: 5m
  # On a schedule (cron, system time zone); missed dates: only the last one.
  - name: nightly-deps
    factory: feature
    inputs: { task: "Update dependencies, run the tests" }
    schedule: { cron: "0 3 * * 1-5" }
