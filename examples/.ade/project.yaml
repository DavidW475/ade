# Projekt-Konfiguration: <repo>/.ade/project.yaml
# Alle Schlüssel sind optional. Unbekannte Schlüssel sind ein Fehler.

# Anzeigename im Dashboard (Default: Verzeichnisname des Repos).
name: Mein Projekt

# Branch, von dem neue Workspaces abzweigen
# (Default: origin/HEAD bzw. der Branch, der beim Registrieren ausgecheckt war).
base_branch: main

# Standard-Adapter für Agent-Sessions: claude, codex oder pty (ab M2 genutzt).
adapter: claude

# Befehle, die nach dem Anlegen eines Workspaces darin laufen (sh -c, nacheinander,
# Abbruch beim ersten Fehler). Verfügbar: $ADE_WORKSPACE_ID, $ADE_WORKSPACE_PATH.
setup:
  - npm ci
  - go mod download

# Freigaben (doc/architecture.md#43-freigaben): welche Werkzeuge der Agent ohne Rückfrage nutzt.
# Einträge: Tool oder Tool(muster); Reihenfolge deny → ask → allow, alles andere wartet auf eine
# Freigabe im Dashboard. Ein Abschnitt ersetzt die Voreinstellung seiner Umgebung.
approvals:
  # In der Sandbox (Voreinstellung: allow: ["*"]).
  sandbox:
    allow: ["*"]
    deny: ["Bash(git push *)"]
  # Ohne Sandbox (Voreinstellung: Lesen und Dateiänderungen im Workspace).
  local:
    allow: ["Read(**)", "Glob(**)", "Grep(**)", "Edit(**)", "Write(**)", "TodoWrite", "Bash(go test *)", "Bash(npm test)"]
    ask: ["Edit(.github/**)"]
    deny: ["Read(**/.env)"]

# Budgets in USD (M8); 0 oder weglassen heißt keine Grenze. Wird eine Grenze erreicht, beendet
# ADE den Agenten (Status „pausiert“) und legt eine Freigabe an: „Budget erhöhen“ gibt einen
# weiteren Schritt frei (Session: das Session-Budget, Monat: 10 % des Monatsbudgets, mindestens
# 1 $) und setzt den Agenten fort, „Ablehnen“ beendet ihn.
budget:
  # Je Session; beim Start im Dashboard überschreibbar.
  session_usd: 5
  # Alle Sessions des Projekts im Kalendermonat (UTC), auch in verworfenen Workspaces.
  monthly_usd: 100
