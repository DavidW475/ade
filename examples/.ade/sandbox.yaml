# Sandbox configuration of a project: <repo>/.ade/sandbox.yaml (doc/sandbox.md).
# ADE reads it from the project repository, never from the workspace. All keys are optional.
# Reference: doc/configuration.md.

# Own image, e.g. derived from the base image (FROM ghcr.io/davidw475/ade-agent-base) with the
# project's tools. Empty = sandbox.image from the global configuration.
# image: ghcr.io/me/my-project-sandbox:1

# Limits of the container (defaults as here).
resources:
  memory: 4g
  cpus: 2
  pids: 512

# Network rules: the container only reaches the internet through the egress proxy and only
# these targets. Without an egress section the presets anthropic, openai, github-readonly, npm,
# pypi and go-proxy apply; with a section only what is listed here (egress: {} blocks
# everything). Changes take effect within seconds, without a restart. Internal addresses (host,
# containers, private networks) are always blocked.
egress:
  # Domain lists built into the binary: anthropic, openai, github-readonly, npm, pypi, go-proxy
  presets: [anthropic, github-readonly, npm]
  # Own entries: host (ports 80 and 443), *.domain (all subdomains), host:port
  allow:
    - api.example.com
    - "*.githubusercontent.com"
  # Blocks win (without a port: all ports)
  deny:
    - "*.pastebin.com"
  # deny: blocked is blocked. ask: approval in the dashboard.
  on_blocked: deny
