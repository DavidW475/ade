# Sandbox-Konfiguration eines Projekts: <repo>/.ade/sandbox.yaml (doc/sandbox.md).
# ADE liest sie aus dem Projekt-Repo, nie aus dem Workspace. Alle Schlüssel sind optional.

# Eigenes Image, z. B. vom Basis-Image abgeleitet (FROM ghcr.io/davidw475/ade-agent-base) mit
# den Werkzeugen des Projekts. Leer = sandbox.image aus der globalen Konfiguration.
# image: ghcr.io/me/mein-projekt-sandbox:1

# Grenzen des Containers (Defaults wie hier).
resources:
  memory: 4g
  cpus: 2
  pids: 512

# Netzwerk-Regeln: Der Container erreicht das Internet nur über den Egress-Proxy und nur diese
# Ziele. Ohne egress-Abschnitt gelten die Presets anthropic, github-readonly, npm, pypi und
# go-proxy; mit Abschnitt nur, was hier steht (egress: {} sperrt alles). Änderungen wirken nach
# wenigen Sekunden, ohne Neustart. Interne Adressen (Host, Container, private Netze) sind immer
# gesperrt.
egress:
  # Im Binary hinterlegte Domain-Listen: anthropic, github-readonly, npm, pypi, go-proxy
  presets: [anthropic, github-readonly, npm]
  # Eigene Einträge: host (Ports 80 und 443), *.domain (alle Subdomains), host:port
  allow:
    - api.example.com
    - "*.githubusercontent.com"
  # Sperren gehen vor (ohne Port: alle Ports)
  deny:
    - "*.pastebin.com"
  # deny: geblockt ist geblockt. ask (Freigabe im Dashboard) kommt mit M7.
  on_blocked: deny
