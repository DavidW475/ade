# Factory "review-only": two reviewers with different models review a branch independently and
# in parallel, an aggregator summarizes. Changes nothing, no pull request; the result is the
# artifact report.md. Structure: doc/factory.md.
name: review-only
description: Independent reviews of a branch with a summary, without changes

inputs:
  task: { type: text, required: true, description: "What should be reviewed (commits, directory, goal of the change)" }
  branch: { type: branch, description: "Branch to review (default: the project's base branch)" }

roles:
  reviewer-a:
    adapter: claude
    model: opus
    permissions: read
    prompt: prompts/review-only-reviewer.md
    outputs: [{ name: review-a.json, schema: schemas/review.json }]

  reviewer-b:
    adapter: claude        # e.g. codex (without model or with an alias) for another model
    model: sonnet
    permissions: read
    prompt: prompts/review-only-reviewer.md
    outputs: [{ name: review-b.json, schema: schemas/review.json }]

  aggregator:
    adapter: claude
    model: opus
    permissions: read
    prompt: prompts/review-only-aggregator.md
    inputs: [review-a.json, review-b.json]
    outputs: [report.md]

flow:
  - parallel:
      - { step: review-a, role: reviewer-a }
      - { step: review-b, role: reviewer-b }
  - step: report
    role: aggregator

budget:
  max_cost_usd: 5
  max_duration: 1h
