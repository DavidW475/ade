# Factory "refactor": plan in small steps → approval → one step per pass followed by a test run,
# until the plan is done and everything is green → approval → pull request.
# Structure: doc/factory.md.
name: refactor
description: Refactoring in small, individually tested steps

inputs:
  task: { type: text, required: true, description: What should be restructured and why }

roles:
  planner:
    adapter: claude
    model: opus
    permissions: read
    prompt: prompts/refactor-planner.md
    outputs: [plan.md]

  implementer:
    adapter: claude
    model: sonnet
    permissions: write
    prompt: prompts/refactor-implementer.md
    inputs: [plan.md, progress.json, test.json]
    outputs: [{ name: progress.json, schema: schemas/progress.json }]

  tester:
    adapter: claude
    model: haiku
    permissions: write
    prompt: prompts/tester.md
    inputs: [plan.md, progress.json]
    outputs: [{ name: test.json, schema: schemas/test.json }]

flow:
  - step: plan
    role: planner
  - step: approve-plan
    gate: human
  - step: implement
    role: implementer
  - step: test
    role: tester
  - step: next
    when: "implement.remaining > 0 || test.failed > 0"
    goto: implement
    max_iterations: 10
  - step: final
    gate: human
    on_deny: { goto: implement }
  - step: deliver
    action: pull_request

budget:
  max_cost_usd: 15
  max_duration: 4h
