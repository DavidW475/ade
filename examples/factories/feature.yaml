# Fabrik „feature“: Plan → Freigabe → Umsetzung → Review und Test parallel → bei Bedarf zurück
# zur Umsetzung → Freigabe → Pull Request. Gehört (angepasst) nach .ade/factories/feature.yaml
# im Repo; ohne eigene Datei nimmt ADE diese Vorlage. Aufbau: doc/factory.md.
name: feature
description: Feature von der Aufgabe bis zum Pull Request, mit Review und Test

inputs:
  task: { type: text, required: true, description: Was gebaut werden soll }

roles:
  planner:
    adapter: claude
    model: opus            # Alias aus models in config.yaml, sonst unverändert an die CLI
    permissions: read      # sieht den Workspace nur lesend
    prompt: prompts/planner.md
    outputs: [plan.md]     # die letzte Antwort der Rolle

  implementer:
    adapter: claude
    model: sonnet
    permissions: write
    prompt: prompts/implementer.md
    # review.json und test.json gibt es erst ab dem zweiten Durchlauf (Feedback).
    inputs: [plan.md, review.json, test.json]
    outputs: [summary.md]

  reviewer:
    adapter: claude        # z. B. codex für ein zweites Modell
    model: opus
    permissions: read
    prompt: prompts/reviewer.md
    inputs: [plan.md, summary.md]
    outputs: [{ name: review.json, schema: schemas/review.json }]

  tester:
    adapter: claude
    model: haiku
    permissions: write     # darf Tests ergänzen; läuft parallel zum (lesenden) Reviewer
    prompt: prompts/tester.md
    inputs: [summary.md]
    outputs: [{ name: test.json, schema: schemas/test.json }]

flow:
  - step: plan
    role: planner
  - step: approve-plan
    gate: human
  - step: implement
    role: implementer
  - parallel:
      - { step: review, role: reviewer }
      - { step: test, role: tester }
  - step: decide
    when: "review.verdict == 'changes' || test.failed > 0"
    goto: implement
    max_iterations: 3
    on_exhausted: continue # nach drei Runden entscheidet der Mensch am letzten Gate
  - step: final
    gate: human
    on_deny: { goto: implement }   # Ablehnen mit Begründung = Feedback an die Umsetzung
  - step: deliver
    action: pull_request

budget:
  max_cost_usd: 10
  max_duration: 2h
