# Factory "feature": plan → approval → implementation → review and test in parallel → back to the
# implementation if needed → approval → pull request. Goes (adapted) to .ade/factories/feature.yaml
# in the repository; without an own file ADE uses this template. Structure: doc/factory.md.
name: feature
description: Feature from the task to the pull request, with review and test

inputs:
  task: { type: text, required: true, description: What should be built }

roles:
  planner:
    adapter: claude
    model: opus            # alias from models in config.yaml, otherwise passed to the CLI unchanged
    permissions: read      # sees the workspace read-only
    prompt: prompts/planner.md
    outputs: [plan.md]     # the role's last answer

  implementer:
    adapter: claude
    model: sonnet
    permissions: write
    prompt: prompts/implementer.md
    # review.json and test.json only exist from the second pass on (feedback).
    inputs: [plan.md, review.json, test.json]
    outputs: [summary.md]

  reviewer:
    adapter: claude        # e.g. codex for a second model
    model: opus
    permissions: read
    prompt: prompts/reviewer.md
    inputs: [plan.md, summary.md]
    outputs: [{ name: review.json, schema: schemas/review.json }]

  tester:
    adapter: claude
    model: haiku
    permissions: write     # may add tests; runs in parallel to the (read-only) reviewer
    prompt: prompts/tester.md
    inputs: [summary.md]
    outputs: [{ name: test.json, schema: schemas/test.json }]

flow:
  - step: plan
    role: planner
  - step: approve-plan
    gate: human
  - step: implement
    role: implementer
  - parallel:
      - { step: review, role: reviewer }
      - { step: test, role: tester }
  - step: decide
    when: "review.verdict == 'changes' || test.failed > 0"
    goto: implement
    max_iterations: 3
    on_exhausted: continue # after three rounds the human decides at the last gate
  - step: final
    gate: human
    on_deny: { goto: implement }   # denying with a reason = feedback to the implementation
  - step: deliver
    action: pull_request

budget:
  max_cost_usd: 10
  max_duration: 2h
