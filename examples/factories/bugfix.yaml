# Factory "bugfix": reproduce the bug with a test (must fail) → fix → tests green → approval
# → pull request. Structure: doc/factory.md.
name: bugfix
description: Reproduce a bug, fix it and cover it with a test

inputs:
  task: { type: text, required: true, description: "Bug description (behavior, expected, steps)" }

roles:
  reproducer:
    adapter: claude
    model: sonnet
    permissions: write     # writes the test, no production code
    prompt: prompts/bugfix-reproducer.md
    outputs: [{ name: repro.json, schema: schemas/repro.json }]

  fixer:
    adapter: claude
    model: sonnet
    permissions: write
    prompt: prompts/bugfix-fixer.md
    inputs: [repro.json, test.json]
    outputs: [fix.md]

  tester:
    adapter: claude
    model: haiku
    permissions: write
    prompt: prompts/tester.md
    inputs: [repro.json, fix.md]
    outputs: [{ name: test.json, schema: schemas/test.json }]

flow:
  - step: reproduce
    role: reproducer
  - step: check-repro
    when: "!reproduce.reproduced"
    goto: reproduce
    max_iterations: 2      # then the run fails: no fix without a reproduction
  - step: fix
    role: fixer
  - step: test
    role: tester
  - step: decide
    when: "test.failed > 0"
    goto: fix
    max_iterations: 3
  - step: final
    gate: human
    on_deny: { goto: fix }
  - step: deliver
    action: pull_request

budget:
  max_cost_usd: 5
  max_duration: 90m
