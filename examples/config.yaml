# Global ADE configuration: ~/.config/ade/config.yaml (or $ADE_CONFIG).
# All keys are optional; missing values take the defaults shown here. Reference:
# doc/configuration.md.

# Address of the daemon. Only loopback addresses are allowed.
listen: 127.0.0.1:7000

# Database, daemon secret, lock and log.
data_dir: ~/.local/share/ade

# Workspace clones. Must be on the Linux file system, not under /mnt/c.
workspaces_dir: ~/.ade/workspaces

# Always give API keys as a reference, never in plain text. In the sandbox the egress proxy inserts
# the key (anthropic for claude, openai for codex); the container only sees a placeholder. The
# proxy then also counts the tokens. Without a key the CLI uses its own login.
providers:
  anthropic:
    api_key: env:ANTHROPIC_API_KEY
  # openai:
  #   api_key: env:OPENAI_API_KEY

# Model aliases (doc/factory.md#4-models-and-providers): use them instead of model IDs when
# starting an agent and in factories. The provider must match the adapter
# (claude → anthropic, codex → openai). Names without an alias go to the CLI unchanged.
models:
  opus:   { provider: anthropic, id: claude-opus-5-5 }
  sonnet: { provider: anthropic, id: claude-sonnet-5-5 }
  haiku:  { provider: anthropic, id: claude-haiku-5-5 }
  gpt:    { provider: openai,    id: gpt-5.3-codex }

# Prices in USD per million tokens, to extend or correct the built-in table (estimates, see the
# dashboard). The key is a model ID or its prefix; the longest match wins. Without a price ADE
# only counts tokens.
# pricing:
#   claude-opus-5-5: { input: 4, output: 20, cache_read: 0.4, cache_write: 5 }
#   gpt-5.3-codex:   { input: 1.75, output: 14, cache_read: 0.175 }

defaults:
  adapter: claude
  # Create new workspaces in the Docker sandbox (can be switched per start in the dashboard).
  sandbox: true

# Docker sandbox (doc/sandbox.md).
sandbox:
  # Default image; empty = ghcr.io/davidw475/ade-agent-base matching the ADE version.
  image: ""
  # docker binary; empty = docker in PATH. Also rootless Docker or "podman"
  # (doc/sandbox.md#6-container-runtimes).
  docker: ""

# Browser IDE (openvscode-server, extensions from Open VSX).
ide:
  # Own openvscode-server; empty = ADE downloads the tested version on demand.
  binary: ""
  # Without an open IDE tab the IDE is stopped after this time (at least 1m).
  idle_timeout: 15m

# Approvals (doc/architecture.md#43-approvals). Rules per project are in .ade/project.yaml
# under approvals.
approvals:
  # Waiting time for a decision in the dashboard; after that the request counts as denied (10s–2h).
  timeout: 10m
