version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - revive
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # Not every package needs a package comment in every file.
        - -ST1000
    gosec:
      excludes:
        # Subprocesses (daemon, browser) are intended.
        - G204
        # Reading configuration and log paths from variables is the purpose here.
        - G304
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
