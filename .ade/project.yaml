# ADE configuration for this repository (see examples/.ade/project.yaml).

name: ADE

base_branch: main

# Agents work here with Claude Code.
adapter: claude

# Install dependencies in every new workspace, so `make build`, `make test` and `make lint`
# work right away. node_modules is not checked in.
setup:
  - go mod download
  - npm ci --prefix web --no-audit --no-fund
